<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Food Finder</title>
  <meta name="description" content="Plan your week by swiping recipes, then get one smart shopping list. Save money and waste less food.">
  <meta name="theme-color" content="#2d6a4f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Food Finder">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"> Food Finder</a>
    <div class="steps" id="steps" hidden></div>
    <a href="#/settings" class="gear" id="gear" aria-label="Settings" hidden>⚙️</a>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="nav" hidden>
    <a href="#/swipe"><span>🔥</span>Swipe</a>
    <a href="#/kitchen"><span>🧊</span>Kitchen</a>
    <a href="#/plan"><span>📅</span>My week <b class="count" hidden></b></a>
    <a href="#/list"><span>🛒</span>List</a>
    <a href="#/shops"><span>📍</span>Shops</a>
  </nav>

  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <noscript>Food Finder needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
